<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla - Carnicerías Hortensia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 h-screen flex flex-col items-center justify-center p-6">

    <h1 class="text-4xl font-bold text-red-900 mb-2 uppercase tracking-widest">Pantalla de Turnos</h1>
    <p class="text-gray-500 mb-10">Carnicerías Hortensia</p>

    <div class="bg-white p-10 rounded-3xl w-full max-w-md items-center justify-center flex flex-col mb-8 shadow-md border border-gray-100">
        <p class="text-2xl text-gray-500 mb-2 font-medium">Atendiendo ahora:</p>
        <p id="turnoActual" class="text-9xl font-black text-slate-800">T-0</p>
    </div>

    <p id="estadoConexion" class="mt-8 text-sm font-bold text-orange-500">Conectando al servidor...</p>

  <script>
        const IP_SERVIDOR = "127.0.0.1"; 
        const PUERTO = 8081;
        
        let turnoAnterior = "";

        const sonido = new Audio('timbre.mp3');

        function preguntarTurno() {
            fetch(`http://${IP_SERVIDOR}:${PUERTO}/api`)
                .then(res => {
                    if (res.ok) {
                        document.getElementById('estadoConexion').innerText = "🟢 Conectado al servidor";
                        document.getElementById('estadoConexion').className = "mt-8 text-sm font-bold text-green-600";
                        return res.json();
                    }
                    throw new Error("error");
                })
                .then(datos => {
                    document.getElementById('turnoActual').innerText = datos.ticket;
                    
                    if (turnoAnterior !== "" && turnoAnterior !== datos.ticket) {
                        sonido.play().catch(e => console.log("el navegador ha bloqueado el sonido"));
                    }
                    
                    turnoAnterior = datos.ticket;
                })
                .catch(err => {
                    document.getElementById('estadoConexion').innerText = "🔴 Desconectado. Reintentando...";
                    document.getElementById('estadoConexion').className = "mt-8 text-sm font-bold text-red-600";
                });
        }

        preguntarTurno();
        setInterval(preguntarTurno, 5000);
    </script>
</body>
</html>
